services:
  api:
    build: .
    ports:
      - "8000:7860"
    environment:
      - DATABASE_PATH=/data/krishisaathi.db
      - CHROMA_PATH=/data/chroma
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - CONNECTIVITY_MODE=auto
    env_file:
      - .env
    volumes:
      - krishi-data:/data

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile.voice
    environment:
      - DATABASE_PATH=/data/krishisaathi.db
      - CHROMA_PATH=/data/chroma
      - KRISHI_API_BASE_URL=http://api:7860
    env_file:
      - .env
    volumes:
      - krishi-data:/data
    depends_on:
      - api

volumes:
  krishi-data:
